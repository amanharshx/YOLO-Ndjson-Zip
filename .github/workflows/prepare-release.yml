name: Prepare Release

run-name: >
  Prepare Release • ${{ inputs.bump }} •
  ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Open bump PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          BASE_VERSION="${LATEST_TAG#v}"
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest tag '${LATEST_TAG}' is not vX.Y.Z."
            exit 1
          fi

          CURRENT_VERSION=$(jq -r .version package.json)
          if [ "$CURRENT_VERSION" != "$BASE_VERSION" ]; then
            echo "::error::main is at ${CURRENT_VERSION} but the latest tag is ${LATEST_TAG}. Finish the pending release first."
            exit 1
          fi

          OPEN_BUMP=$(gh pr list --state open --json headRefName,url \
            --jq '.[] | select(.headRefName | startswith("release/bump-v")) | .url')
          if [ -n "$OPEN_BUMP" ]; then
            echo "::error::A bump PR is already open: ${OPEN_BUMP}. Merge or close it first."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          case "$BUMP" in
            patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            *) echo "::error::Unknown bump '${BUMP}'."; exit 1 ;;
          esac

          TAG="v$NEW_VERSION"
          BRANCH="release/bump-$TAG"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::Branch $BRANCH already exists with no open PR. Delete it first."
            exit 1
          fi

          {
            echo "version=$NEW_VERSION"
            echo "tag=$TAG"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"
          echo "Preparing $TAG from $LATEST_TAG ($BUMP)."

      - name: Bump versions and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          for f in package.json src-tauri/tauri.conf.json; do
            jq --arg v "$VERSION" '.version = $v' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

          # Only the [package] version; later `version =` lines belong to other tables.
          perl -pi -e 'if (!$done && s/^version = "[^"]+"/version = "$ENV{VERSION}"/) { $done = 1 }' src-tauri/Cargo.toml

          # Only this crate's entry; every [[package]] in the lockfile has a version line.
          perl -pi -e 'if ($seen) { s/^version = "[^"]+"/version = "$ENV{VERSION}"/; $seen = 0 } $seen = 1 if /^name = "ndjson-converter"$/' src-tauri/Cargo.lock

          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: bump version to $TAG"
          git push -u origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump version to $TAG" \
            --body "Bumps the app version to \`$VERSION\`. Merging this tags \`$TAG\`, builds every platform, publishes the release, and updates the Homebrew cask."
