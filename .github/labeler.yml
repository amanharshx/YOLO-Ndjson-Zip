# PR triage rules. These differ intentionally from CI path filters:
# CI filters decide which checks run; these labels describe changed areas.

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "public/**"
          - "index.html"
          - "vite.config.ts"
          - "vitest.config.ts"
          - "tsconfig*.json"

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "src-tauri/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "codecov.yml"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "bun.lock"
          - "src-tauri/Cargo.toml"
          - "src-tauri/Cargo.lock"

release:
  - head-branch:
      - "^release/"
