version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Runs only in release.yml, so CI cannot catch a broken bump.
      - dependency-name: tauri-apps/tauri-action
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
